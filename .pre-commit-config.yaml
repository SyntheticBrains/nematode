repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: [--number]
        additional_dependencies:
          - mdformat-frontmatter
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.411
    hooks:
      - id: pyright
        entry: uv run pyright
  - repo: local
    hooks:
      - id: pytest
        name: tests
        entry: uv run pytest -m "not smoke and not nightly and not slow"
        language: system
        pass_filenames: false
      # The CI shards are balanced by .test_durations, and a test missing from it is budgeted at the
      # MEAN of the recorded ones rather than left unestimated. Drift is therefore silent and costly,
      # and pytest-split's own balance report cannot show it: it scores each split with the same
      # stale numbers that produced it. This checks how much of the suite the file still describes.
      - id: test-durations-freshness
        name: test durations freshness
        entry: uv run python scripts/check_test_durations.py
        language: system
        pass_filenames: false
        always_run: true
