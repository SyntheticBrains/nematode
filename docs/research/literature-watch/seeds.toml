# --- Keyword search ------------------------------------------------------------------------------
# Preprints whose title or abstract carries a term, on the listed servers, through OpenAlex. Added
# 2026-10-03 for two reasons found by hand that week. arXiv's query API returns HTTP 406 to GitHub
# Actions runners, so the arXiv category sweep below can fail outright there. And the papers that
# mattered most were filed outside the swept categories — a C. elegans reservoir benchmark under
# cs.LG, a connectome robot controller under cs.RO — where no category sweep would have looked.
# Over the fortnight it was tested on, these terms returned 18 arXiv records, every one of the
# three that mattered among them.
[openalex_search]
enabled = true
lookback_days = 21
terms = ["connectome", "elegans", "nematode", "neuromechanical"]

[[openalex_search.sources]]
id = "S4306400194"
label = "arXiv"

# --- Preprint sweeps ---------------------------------------------------------------------------
# Lower precision, and the reason the triage pass exists. These catch work before it is citable and
# therefore before citation chaining can see it at all.

[arxiv]
enabled = true
lookback_days = 8
categories = ["q-bio.NC", "cs.NE"]
# When the query API refuses (it answers HTTP 406 to GitHub Actions runners), read the category RSS
# feed instead. It carries only the latest announcement day, and the digest says so.
rss_fallback = true

[biorxiv]
enabled = true
lookback_days = 8
servers = ["biorxiv"]
categories = ["neuroscience", "systems biology", "animal behavior and cognition"]
