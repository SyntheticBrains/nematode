name: Pre-commit

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Generate LFS cache key
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
        env:
          GIT_LFS_SKIP_SMUDGE: '1'

      - name: Cache Git LFS objects
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: |
            lfs-${{ runner.os }}-

      - name: Pull LFS objects
        # .lfsconfig limits fresh clones to data/**; CI needs every object
        # (tests read artifacts/), so override the include filter here.
        run: git lfs pull --include='**' && git lfs checkout

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --extra analysis --extra cpu --extra pixel --extra qpu --extra torch --dev

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1
        env:
          # Skip pytest in pre-commit as it runs in a separate workflow
          SKIP: pytest

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "❌ Pre-commit hooks modified files. Please run 'pre-commit run --all-files' locally and commit the changes."
            exit 1
          fi
