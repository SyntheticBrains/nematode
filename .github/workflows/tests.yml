name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Superseded PR runs are pointless once a newer commit is pushed. Pushes to the
# long-lived branches are never cancelled — their coverage upload is the record.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only PRs skip the 5-shard matrix (~25 runner-minutes) but the required
  # "Tests" context still reports via tests-complete below. Classification is
  # fail-open: only paths on the docs allowlist skip; anything else — including
  # new top-level directories and this workflow itself — runs the full matrix.
  # Pushes to main are never filtered, so the coverage record stays unbroken.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: false
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Push event: full test run (main's coverage upload is the record)."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)
          echo "Changed files:"
          echo "$files"
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|openspec/*|.claude/*|*.md|CITATION.cff|LICENSE|.gitignore|.markdownlint.jsonc) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "false" ]; then
            echo "Docs-only change: test shards will be skipped."
          fi

  test:
    name: Python 3.13 (shard ${{ matrix.group }}/5)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5]

    env:
      # One BLAS/OpenMP thread per xdist worker. Without this, every worker
      # spawns a full thread pool and the 4 vCPUs are oversubscribed several
      # times over, which costs more than the parallelism gains.
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Generate LFS cache key
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
        env:
          GIT_LFS_SKIP_SMUDGE: '1'

      - name: Cache Git LFS objects
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: |
            lfs-${{ runner.os }}-

      - name: Pull LFS objects
        # .lfsconfig limits fresh clones to data/**; CI needs every object
        # (tests read artifacts/), so override the include filter here.
        run: git lfs pull --include='**' && git lfs checkout

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # v9 stopped pruning unused wheels before saving; keep the cache small.
          prune-cache: true

      - name: Install dependencies
        run: |
          uv sync --extra cpu --extra pixel --extra torch --dev

      - name: Run tests
        run: |
          uv run pytest -m "not nightly" \
            --splits 5 --group ${{ matrix.group }} \
            --durations-path .test_durations \
            -n logical \
            --cov --cov-branch --cov-report=xml \
            --tb=short --color=yes

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-shard-${{ matrix.group }}
          fail_ci_if_error: false

  # The ruleset-required "Tests" context. Reports a genuine success when the
  # shards were deliberately skipped for a docs-only diff; fails on any shard
  # failure, cancellation, or an unexpected skip (code change but no shards).
  tests-complete:
    name: Tests
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: always()
    steps:
      - name: Check shard results
        run: |
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "All test shards passed."
          elif [ "${{ needs.test.result }}" = "skipped" ] && [ "${{ needs.changes.outputs.code }}" = "false" ]; then
            echo "Docs-only change: test shards deliberately skipped."
          else
            echo "::error::Test shards did not succeed (result: ${{ needs.test.result }}, code changes: ${{ needs.changes.outputs.code }})."
            exit 1
          fi
