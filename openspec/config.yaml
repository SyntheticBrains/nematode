schema: spec-driven

context: |
  ## Reference
  See AGENTS.md for full project instructions, tech stack, commands, conventions,
  and testing. The information below supplements AGENTS.md with domain-specific
  context for OpenSpec artifact creation.

  ## Purpose
  Quantum Nematode is a closed-loop sensory-motor simulation platform: a
  simulated C. elegans forages, evades predators and navigates thermal/oxygen
  gradients while a pluggable brain architecture is trained by learning or
  evolution. The research question is which architecture best learns nematode
  behaviours, with the real C. elegans connectome as the focal comparison point
  (docs/roadmap.md). Quantum circuits are one architecture family in that
  comparison, not the organising principle. Focus areas: connectome-constrained
  learning, biologically-faithful sensing, architecture ranking under a
  paired-seed statistical protocol, real-worm behavioural validation, and
  (Phase 7) biologically-plausible plasticity and cross-species transfer.

  ## Architecture
  - UV workspace: packages/quantum-nematode is the core package
  - 26 pluggable brain architectures in brain/arch/: qvarcircuit, qrc, qrh, qef, crh, qrhqlstm,
    crhqlstm, qsnnreinforce, qsnnppo, qliflstm, hybridquantum, hybridclassical,
    hybridquantumcortex, mlpreinforce, mlpdqn, mlpppo, lstmppo, spikingreinforce, connectomeppo,
    feedforwardga, cfcppo, spikingppo, equivariantquantum, transformerppo, mingruppo,
    minlstmppo. Architectures self-register
    via @register_brain in brain/arch/_registry.py; see
    docs/architecture/plugin-developer-guide.md for how to add a new one.
  - Two substrates: DynamicForagingEnvironment (discrete grid, Phases 0-5) and
    Continuous2DEnvironment (Phase 6: float (speed, turn) kinematics, Euclidean
    geometry, Fick-shaped concentration fields, adaptive biphasic chemosensor);
    both with multi-food foraging, predators, thermotaxis, aerotaxis, and
    multi-agent support (2-10 agents with food competition)
  - MultiAgentSimulation: orchestrator for multi-agent episodes with synchronous
    stepping, food competition, pheromone communication (food-marking + alarm +
    aggregation), social feeding (npr-1 satiety decay reduction), social proximity
    sensing, collective behavior metrics, and per-agent metrics with CSV export
  - Executor pattern: CPU, GPU (CUDA), MPS (Apple Metal, PyTorch brains only) and QPU backends;
    device selection is validated against the brain family before construction
  - YAML-driven simulation configs (configs/scenarios/)
  - Comprehensive tracking: EpisodeTracker, experiment metadata, CSV/plot exports

  ## Domain Context
  - C. elegans: chemotaxis, thermotaxis, tactile feedback, satiety management
  - Quantum: variational circuits, parameter-shift rule, quantum feature encoding,
    QLIF spiking neurons, surrogate gradients, hybrid quantum-classical training
  - RL: REINFORCE, DQN, experience replay, PPO, reward shaping
  - Spiking networks: LIF neurons, STDP learning, surrogate gradients
  - Grid world: 2D dynamic foraging with viewport-based perception; continuous-2D:
    sub-cell kinematics with klinotaxis head-sweep sensing

  ## Constraints
  - IBM Quantum API key required for QPU execution
  - NVIDIA Container Toolkit required for Docker GPU
  - Quantum simulation is memory-intensive for larger circuits
  - Private/research codebase (Do Not Upload classifier)
  - Apache 2.0 license, GitHub: SyntheticBrains/nematode
