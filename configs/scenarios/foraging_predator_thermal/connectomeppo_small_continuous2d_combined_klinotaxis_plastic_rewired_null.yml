# Plastic degree-preserving REWIRED-NULL C3 cell — CONNECTOMEPPO under the
# three-factor rule.
#
# The other cell of the flagship's primary contrast. Single-key delta from
# the plastic wild-type arm
# (connectomeppo_small_continuous2d_combined_klinotaxis_plastic.yml): the
# chemical and gap-junction edge sets are replaced by a degree-preserving
# edge-swapped null before the topology is built, so the mask, the weight
# support, the eligibility traces and every plastic update sit on the
# rewired wiring by construction. Nothing else changes.
#
# What the two plastic arms share at one run seed: the anatomical motor
# readout, every sensory-projection gain, log_std, the trace configuration
# and every plasticity hyperparameter; the chemical edge count and every
# neuron's chemical in/out degree and gap degree, hence each weight's
# initialisation scale. What differs: which neurons are connected, where the
# initial weight draws land, and the gap-junction matrix. Motor pools and
# sensory targets are neuron identities, untouched by rewiring, so the
# readout and the sensory injection mean the same thing here as on the
# wild-type -- the contrast is about the wiring, not about where the world
# enters or leaves the network.
#
# The rewiring seed is left unset so it derives from the run seed: seed k of
# this arm pairs with seed k of the wild-type arm, as the panel's
# paired-seed protocol requires.
max_steps: 2400
brain:
  name: connectomeppo
  config:
    # Degree-preserving rewired-null wiring: every neuron keeps its in/out
    # degree; only which neurons connect changes. rewire_seed is unset on
    # purpose -- it derives from the run seed, pairing this arm with the
    # wild-type arm seed for seed.
    wiring: rewired_degree_preserving
    action_mode: continuous
    connectome_source: cook_2019_hermaphrodite
    enable_gap_junctions: true
    chemical_mask_mode: strict
    sensing_mode: klinotaxis
    enable_predator_projection: true
    enable_thermotaxis_projection: true
    forward_pass_depth: 4
    freeze_updates: false
    clip_epsilon: 0.2
    gamma: 0.99
    gae_lambda: 0.95
    value_loss_coef: 0.5
    entropy_coef: 0.005
    learning_rate: 0.0003
    rollout_buffer_size: 256
    num_epochs: 10
    num_minibatches: 2
    max_grad_norm: 0.5
    # Learning rule: reward-modulated Hebbian plasticity on the chemical
    # synapses. Requires the eligibility traces below — the update is
    # proportional to them, so the pairing is validated at load time.
    learning_rule: three_factor
    enable_activity_traces: true
reward:
  reward_goal: 2.0
  reward_distance_scale: 0.5
  reward_exploration: 0.05
  penalty_step: 0.005
  penalty_anti_dithering: 0.02
  penalty_stuck_position: 0
  penalty_starvation: 10.0
  stuck_position_threshold: 0
  penalty_boundary_collision: 0.02
  penalty_predator_death: 10.0
  penalty_predator_proximity: 0.15
  penalty_health_damage: 0.5
  reward_health_gain: 0.1
  reward_mode: distal_chemo_contact_trigger
  penalty_temperature_proximity: 0.3
satiety:
  initial_satiety: 900
  satiety_decay_rate: 0.8
  satiety_gain_per_food: 20.0
environment:
  env_type: continuous_2d
  continuous:
    world_size_mm: 60.0
    body_length_mm: 1.0
    max_step_mm: 1.0
    capture_radius_mm: 2.0
    sweep_amplitude_mm: 0.5
    max_turn_rad: 0.5
    predator_damage_radius_mm: 1.0
  viewport_size:
  - 11
  - 11
  sensing:
    chemotaxis_mode: klinotaxis
    stam_enabled: true
    stam_buffer_size: 30
    stam_decay_rate: 0.1
    adaptive_chemosensor_enabled: true
    adaptive_chemosensor_readout: fold_change
    adaptive_chemosensor_alpha: 0.1
    adaptive_chemosensor_epsilon: 0.1
    predator_mechano_mode: klinotaxis
    predator_distal_mode: klinotaxis
    thermotaxis_mode: klinotaxis
  foraging:
    foods_on_grid: 45
    target_foods_to_collect: 10
    min_food_distance: 3
    agent_exclusion_radius: 5
    gradient_field_mode: fick
    gradient_decay_constant: 24.0
    gradient_strength: 1.0
  health:
    max_hp: 100.0
    predator_damage: 15.0
    food_healing: 10.0
  predators:
    enabled: true
    count: 2
    speed: 0.4
    movement_pattern: pursuit
    detection_radius: 15
    gradient_decay_constant: 5.0
    gradient_strength: 1.0
  thermotaxis:
    enabled: true
    cultivation_temperature: 20.0
    base_temperature: 20.0
    gradient_direction: 0.0
    gradient_strength: 0.4
    hot_spots: []
    cold_spots: []
    spot_decay_constant: 8.0
    comfort_reward: 0.0
    discomfort_penalty: -0.05
    danger_penalty: -0.3
    reward_discomfort_food: 0.0
    danger_hp_damage: 2.0
    lethal_hp_damage: 10.0
    comfort_delta: 5.0
    discomfort_delta: 10.0
    danger_delta: 15.0
