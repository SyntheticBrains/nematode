# Grounded-signs Hebbian arm under ANTI-HEBBIAN INHIBITORY plasticity -- CONNECTOMEPPO.
#
# Single-key-block delta from connectomeppo_small_continuous2d_combined_klinotaxis_plastic_hebbian_atlassigns.yml: the decorrelation keys
# below. The Hebbian term is negated at every synapse the atlas grounds as inhibitory, so co-activity
# strengthens what such a synapse does rather than unwinding it. The term's magnitude is
# unchanged, so this redirects the update rather than resizing it, and it has no
# hyperparameter: it is the same update with one factor of -1 on an identified subset.
# Everything else -- wiring, rule, recipe, noise, grounded signs -- is that file's, so a
# difference in outcome is the term's.
max_steps: 2400
brain:
  name: connectomeppo
  config:
    # Atlas-grounded synapse signs: each chemical weight keeps the magnitude it drew and
    # takes the sign its pre-synaptic neuron's released transmitter implies (acetylcholine
    # and glutamate excitatory, GABA inhibitory), leaving monoaminergic, orphan and
    # uptake-only sources on the sign they drew. 3,176 of 3,709 synapses are grounded.
    synapse_signs: atlas
    action_mode: continuous
    connectome_source: cook_2019_hermaphrodite
    enable_gap_junctions: true
    chemical_mask_mode: strict
    sensing_mode: klinotaxis
    enable_predator_projection: true
    enable_thermotaxis_projection: true
    forward_pass_depth: 4
    freeze_updates: false
    clip_epsilon: 0.2
    gamma: 0.99
    gae_lambda: 0.95
    value_loss_coef: 0.5
    entropy_coef: 0.005
    learning_rate: 0.0003
    rollout_buffer_size: 256
    num_epochs: 10
    num_minibatches: 2
    max_grad_norm: 0.5
    # Learning rule: UNMODULATED Hebbian plasticity on the chemical synapses
    # — dw = eta * E, plain co-activity learning. Reward is observed and
    # reported but never applied to the update, which is what makes this the
    # ablation floor rather than a second plastic arm. Requires the
    # eligibility traces below: the update is proportional to them, so the
    # pairing is validated at load time.
    learning_rule: hebbian
    enable_activity_traces: true
    # Substrate-invariant scaling, set on every panel arm for parity. On this
    # unmodulated arm the third factor is 1, so modulator normalisation is
    # inactive (the switch is carried, not used); trace normalisation applies:
    # each plastic tensor's Hebbian term is divided by rho, a running RMS of
    # its trace over its edge set, so the rate means the same root-mean-square
    # step here as on the modulated arms.
    plasticity_normalise_modulator: true
    plasticity_normalise_trace: true
    # Homeostatic incoming-norm scaling, on for every panel arm: after each
    # update a unit's incoming plastic weights return to the norm they had at
    # construction, so Hebbian positive feedback cannot run them onto the
    # bound. The action noise every arm is frozen at (std ~0.37): a probe
    # selected it by a rule stated in advance; std 1.0 capped every plastic
    # arm near its floor, and std 0.22 rose and collapsed.
    plasticity_homeostasis: true
    initial_log_std: -1.0
    # The panel recipe: selected by the pilot's pooled rule on the registered
    # grid and pinned here explicitly, so the rate is visible in the file
    # rather than inherited from a default. Every arm shares it.
    plasticity_rate: 0.001
    plasticity_decorrelation: anti_hebbian_inhibitory
reward:
  reward_goal: 2.0
  reward_distance_scale: 0.5
  reward_exploration: 0.05
  penalty_step: 0.005
  penalty_anti_dithering: 0.02
  penalty_stuck_position: 0
  penalty_starvation: 10.0
  stuck_position_threshold: 0
  penalty_boundary_collision: 0.02
  penalty_predator_death: 10.0
  penalty_predator_proximity: 0.15
  penalty_health_damage: 0.5
  reward_health_gain: 0.1
  reward_mode: distal_chemo_contact_trigger
  penalty_temperature_proximity: 0.3
satiety:
  initial_satiety: 900
  satiety_decay_rate: 0.8
  satiety_gain_per_food: 20.0
environment:
  env_type: continuous_2d
  continuous:
    world_size_mm: 60.0
    body_length_mm: 1.0
    max_step_mm: 1.0
    capture_radius_mm: 2.0
    sweep_amplitude_mm: 0.5
    max_turn_rad: 0.5
    predator_damage_radius_mm: 1.0
  viewport_size:
  - 11
  - 11
  sensing:
    chemotaxis_mode: klinotaxis
    stam_enabled: true
    stam_buffer_size: 30
    stam_decay_rate: 0.1
    adaptive_chemosensor_enabled: true
    adaptive_chemosensor_readout: fold_change
    adaptive_chemosensor_alpha: 0.1
    adaptive_chemosensor_epsilon: 0.1
    predator_mechano_mode: klinotaxis
    predator_distal_mode: klinotaxis
    thermotaxis_mode: klinotaxis
  foraging:
    foods_on_grid: 45
    target_foods_to_collect: 10
    min_food_distance: 3
    agent_exclusion_radius: 5
    gradient_field_mode: fick
    gradient_decay_constant: 24.0
    gradient_strength: 1.0
  health:
    max_hp: 100.0
    predator_damage: 15.0
    food_healing: 10.0
  predators:
    enabled: true
    count: 2
    speed: 0.4
    movement_pattern: pursuit
    detection_radius: 15
    gradient_decay_constant: 5.0
    gradient_strength: 1.0
  thermotaxis:
    enabled: true
    cultivation_temperature: 20.0
    base_temperature: 20.0
    gradient_direction: 0.0
    gradient_strength: 0.4
    hot_spots: []
    cold_spots: []
    spot_decay_constant: 8.0
    comfort_reward: 0.0
    discomfort_penalty: -0.05
    danger_penalty: -0.3
    reward_discomfort_food: 0.0
    danger_hp_damage: 2.0
    lethal_hp_damage: 10.0
    comfort_delta: 5.0
    discomfort_delta: 10.0
    danger_delta: 15.0
