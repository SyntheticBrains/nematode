# Init-vs-rewiring control arm — dense_mask initialisation (Phase 8 A.1).
#
# Single-key delta from connectomeppo_small_continuous2d_fick_adaptive_klinotaxis_hard350_frozen.yml: `weight_draw: dense_mask`,
# and nothing else changes.
#
# `weight_draw` chooses the chemical draw's STRUCTURE, which decides what the wild-type and
# rewired arms hold in common at one seed. The default `edge_order` walks the (pre, post)-sorted
# edge list drawing one value per edge: both graphs have the same edge count, so they consume
# the same standard-normal stream and the nth VALUE matches -- but the nth EDGE does not, so the
# value-to-edge pairing differs. That pairing is the residual confound in the wiring contrast,
# and this arm removes it by one dense draw read by (pre, post), so every chemical edge present in BOTH the wild-type
# and rewired graphs carries the IDENTICAL value.
#
# Neither definition is uniquely "the same initialisation" once the edge set changes, which is
# why both run as arms rather than one being chosen.
#
# `rewire_seed` stays unset here as in every block-V arm, so the rewiring RNG derives from the
# run seed and each seed's wild-type and rewired arms pair. Isolating the graph from the weights
# ACROSS seeds is a different experiment and is not this one.
#
# ----- inherited from the parent -----

max_steps: 350  # calibrated difficulty (see header)
brain:
  name: connectomeppo
  config:
    action_mode: continuous  # tanh-squashed Gaussian (speed, turn) head

    connectome_source: cook_2019_hermaphrodite
    enable_gap_junctions: true
    chemical_mask_mode: strict
    sensing_mode: klinotaxis  # 3-feature head-sweep input
    weight_draw: dense_mask  # the A.1 delta; see the header
    forward_pass_depth: 4
    freeze_updates: true  # PPO update no-oped; weights stay byte-identical to init.

    clip_epsilon: 0.2
    gamma: 0.99
    gae_lambda: 0.95
    value_loss_coef: 0.5
    # C1 recipe (see MLP config header): entropy 0.05 + lr 0.0003 on the metric-coherent reward
    # (the bug-era 0.10 / 0.001 compensated for the now-fixed value explosion). Subject to the
    # connectome's own per-seed/entropy check (Stage 2 step 2a).
    entropy_coef: 0.05
    learning_rate: 0.0003
    rollout_buffer_size: 256
    num_epochs: 10
    num_minibatches: 2
    max_grad_norm: 0.5

reward:
  reward_goal: 2.0
  reward_distance_scale: 0.5
  reward_exploration: 0.05
  penalty_step: 0.005
  penalty_anti_dithering: 0.02
  penalty_stuck_position: 0
  penalty_starvation: 10.0
  stuck_position_threshold: 0
  penalty_boundary_collision: 0.02

satiety:
  # Forage-to-survive over the episode (see MLP config header).
  initial_satiety: 300.0
  satiety_decay_rate: 0.8
  satiety_gain_per_food: 0.2  # matches the thermal cell; not a pressure source

environment:
  env_type: continuous_2d
  continuous:
    world_size_mm: 20.0
    body_length_mm: 1.0
    max_step_mm: 1.0
    capture_radius_mm: 2.0  # body/patch scale (calibrated — see MLP config header)
    sweep_amplitude_mm: 0.5
    max_turn_rad: 0.5  # ~29deg/step — biologically realistic turn bound (env default; explicit here)

  viewport_size: [11, 11]

  sensing:
    chemotaxis_mode: klinotaxis
    stam_enabled: true
    stam_buffer_size: 30
    stam_decay_rate: 0.1
    # Adaptive chemosensory sensor: fold-change on the derivative channel.
    adaptive_chemosensor_enabled: true
    adaptive_chemosensor_readout: fold_change
    adaptive_chemosensor_alpha: 0.1  # no-op under fold_change (only `contrast` uses the background)
    adaptive_chemosensor_epsilon: 0.1  # calibrated (0.001 collapses foraging — see MLP config header)

  foraging:
    foods_on_grid: 5
    target_foods_to_collect: 20  # registered saturation remedy (see header)
    min_food_distance: 3
    agent_exclusion_radius: 5
    # Static Fick-shaped gradient geometry (Gaussian kernel, L = decay).
    gradient_field_mode: fick
    gradient_decay_constant: 8.0
    gradient_strength: 1.0
