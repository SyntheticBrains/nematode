# Operating-point surface arm (PPO half, wt_learn) — initial_log_std at 0.5 (Phase 8 A.2).
#
# Single-key delta from connectomeppo_small_continuous2d_fick_adaptive_klinotaxis_hard350.yml:
#   initial_log_std: 0.5
# and nothing else changes. The pin is the initial continuous action noise.
#
# One point of the one-factor-at-a-time pass around the committed operating point, which
# the parent carries unchanged as this half's centre arm.
#
# Generated by scripts/campaigns/generate_operating_point_configs.py. The body below is
# the parent's keys, re-emitted -- the parent's own header comments do not survive the
