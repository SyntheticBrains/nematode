# Gap-only split arm (PPO) — the gap-held rewired null (Phase 8 A.6 follow-up).
#
# Delta from connectomeppo_small_continuous2d_fick_adaptive_klinotaxis_hard350_rewired_null.yml, and nothing else changes:
#   wiring: rewired_gap_junctions_held
#
# The chemical graph is the parent null's exactly -- the same swap at the same seed,
# autapses handled as there -- and only the gap junctions (pairs and counts) are held at
# the wild type's, so this null differs from its parent in its gap junctions alone.
#
# Generated by scripts/campaigns/generate_null_strength_configs.py. The body below is the
# parent's keys, re-emitted -- the parent's own header comments do not survive the round
# trip, so read that file for the cell's provenance. The delta above is re-checked through
# the real config loader by test_gap_split.py.
#
max_steps: 350
brain:
  name: connectomeppo
  config:
    action_mode: continuous
    connectome_source: cook_2019_hermaphrodite
    enable_gap_junctions: true
    chemical_mask_mode: strict
    sensing_mode: klinotaxis
    forward_pass_depth: 4
    wiring: rewired_gap_junctions_held
    freeze_updates: false
    clip_epsilon: 0.2
    gamma: 0.99
    gae_lambda: 0.95
    value_loss_coef: 0.5
    entropy_coef: 0.05
    learning_rate: 0.0003
    rollout_buffer_size: 256
    num_epochs: 10
    num_minibatches: 2
    max_grad_norm: 0.5
reward:
  reward_goal: 2.0
  reward_distance_scale: 0.5
  reward_exploration: 0.05
  penalty_step: 0.005
  penalty_anti_dithering: 0.02
  penalty_stuck_position: 0
  penalty_starvation: 10.0
  stuck_position_threshold: 0
  penalty_boundary_collision: 0.02
satiety:
  initial_satiety: 300.0
  satiety_decay_rate: 0.8
  satiety_gain_per_food: 0.2
environment:
  env_type: continuous_2d
  continuous:
    world_size_mm: 20.0
    body_length_mm: 1.0
    max_step_mm: 1.0
    capture_radius_mm: 2.0
    sweep_amplitude_mm: 0.5
    max_turn_rad: 0.5
  viewport_size:
  - 11
  - 11
  sensing:
    chemotaxis_mode: klinotaxis
    stam_enabled: true
    stam_buffer_size: 30
    stam_decay_rate: 0.1
    adaptive_chemosensor_enabled: true
    adaptive_chemosensor_readout: fold_change
    adaptive_chemosensor_alpha: 0.1
    adaptive_chemosensor_epsilon: 0.1
  foraging:
    foods_on_grid: 5
    target_foods_to_collect: 20
    min_food_distance: 3
    agent_exclusion_radius: 5
    gradient_field_mode: fick
    gradient_decay_constant: 8.0
    gradient_strength: 1.0
