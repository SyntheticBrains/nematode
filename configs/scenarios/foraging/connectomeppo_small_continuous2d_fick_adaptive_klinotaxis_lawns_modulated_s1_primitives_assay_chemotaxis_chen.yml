# Assay `chemotaxis_chen` on the 1-second primitives worm, arm `modulated`.
#
# Reference: Chen et al. 2025, PLoS Biology 10.1371/journal.pbio.3003005 (naive N2, butanone).
# Derived from connectomeppo_small_continuous2d_fick_adaptive_klinotaxis_lawns_modulated_s1_primitives.yml: the reference's arena, one centred
# lawn, its phases and analysis window; satiety a 12-h reserve that never ends the
# episode; no movement cost; a lawn whose cells halve in about 2 h under a still worm.
# The odour is Chen's measured butanone field, which the batched evaluator reads
# off food (quantumnematode.evaluation.odour_field); the assay phase starts each
# worm at a real worm's start. The fed phase approximates the naive worms' feeding.
#
# Generated by scripts/campaigns/generate_assay_configs.py; re-checked through the
# real config loader by test_assay_configs.py.
#
step_seconds: 1.0
max_steps: 900
brain:
  name: connectomeppo
  config:
    action_mode: continuous
    connectome_source: emmons_2024_hermaphrodite
    enable_gap_junctions: true
    chemical_mask_mode: strict
    sensing_mode: klinotaxis
    forward_pass_depth: 4
    freeze_updates: false
    clip_epsilon: 0.2
    gamma: 0.99
    gae_lambda: 0.95
    value_loss_coef: 0.5
    entropy_coef: 0.005
    learning_rate: 0.0003
    rollout_buffer_size: 256
    num_epochs: 10
    num_minibatches: 2
    max_grad_norm: 0.5
    signed_speed: false
    modulators: true
    action_space: primitives
reward:
  reward_goal: 2.0
  reward_distance_scale: 0
  reward_exploration: 0
  penalty_step: 0.005
  penalty_anti_dithering: 0
  penalty_stuck_position: 0
  penalty_starvation: 10.0
  stuck_position_threshold: 0
  penalty_boundary_collision: 0.02
satiety:
  initial_satiety: 300.0
  satiety_decay_rate: 0.034722222222222224
  satiety_gain_per_food: 0.2
  starvation_ends_episode: false
environment:
  env_type: continuous_2d
  continuous:
    world_size_mm: 100.0
    body_length_mm: 1.0
    max_step_mm: 1.0
    capture_radius_mm: 2.0
    sweep_amplitude_mm: 0.5
    max_turn_rad: 3.141593
    allow_reversal: false
    locomotion: primitives
    arena_shape: square
  viewport_size:
  - 11
  - 11
  sensing:
    chemotaxis_mode: klinotaxis
    stam_enabled: true
    stam_buffer_size: 30
    stam_decay_rate: 0.1
    adaptive_chemosensor_enabled: true
    adaptive_chemosensor_readout: fold_change
    adaptive_chemosensor_alpha: 0.1
    adaptive_chemosensor_epsilon: 0.1
  foraging:
    agent_exclusion_radius: 5
    gradient_field_mode: fick
    gradient_decay_constant: 8.0
    gradient_strength: 1.0
    food_model: lawns
    lawns:
      count: 1
      radius_mm: 25.0
      min_separation_mm: 2.0
      cell_mm: 1.0
      quality:
      - 1.0
      - 1.0
      intake_fraction: 0.0005
      reward_per_intake: 10.0
      satiety_per_intake: 3.0
      regrowth_per_step: 0.0
      movement_cost_per_mm: 0.0
      start_on_lawn: false
      start_clearance_mm: 2.0
      wall_clearance_mm: 1.0
      placement: centre
  assay:
    name: chemotaxis_chen
    phases:
    - name: fed
      duration_s: 2700.0
      food: lawns
      place: lawn_centre
    - name: assay
      duration_s: 1800.0
      food: none
      place: arena_centre
    assay_phase: assay
    analysis_from_s: 0.0
