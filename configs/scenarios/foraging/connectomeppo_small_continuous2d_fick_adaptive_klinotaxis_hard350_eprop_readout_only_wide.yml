# L.1 readout-width arm: wild-type wiring, readout learns per neuron
#
# IDENTICAL to `connectomeppo_small_continuous2d_fick_adaptive_klinotaxis_hard350_eprop_readout_only.yml` except `readout_width: per_neuron` — asserted by an
# exact-key test. The readout maps each of the 39 motor neurons to the action (78 parameters)
# instead of the four motor-class MEANS (8), so the learner can read *which* neuron fires rather
# than only which class.
#
# The per-neuron map is INITIALISED BY EXPANDING the pooled draw — `w_i = pooled_c / |class(i)|` —
# so the orthogonal draw still happens at the pooled shape, the RNG stream is untouched, and this
# arm starts from the same policy as its pooled partner. The only difference is the space the
# learner can move in, which is the manipulation.
#
# L.1 reads the INTERACTION, not this arm against L.0's: a per-neuron readout has ten times the
# parameters, so a gain against the pooled arm alone cannot separate "the wiring's features were
# hidden by the pool" from "more parameters learn faster". The contrast that separates them is
# (wt_wide - wt_pooled) - (rn_wide - rn_pooled).
#
# The CONTROL for the plastic-readout arm: the readout learns, the chemical matrix does not.
#
# A plastic readout is an 8-parameter linear map over four pooled motor-class means. "A local rule
# learns this substrate" and "a small linear readout on frozen recurrent features learns this cell"
# predict the same success, so without this arm a positive plastic-readout result cannot be told from
# the second. `plastic_readout - readout_only` is what the substrate's OWN plasticity contributes.
#
# IDENTICAL to ..._eprop_plastic_readout.yml except `plasticity_plastic_tensors: readout_only`.
#
# Not a freeze: this arm learns, and its floor is the same shared frozen control as every other arm.
# Its credited-synapse drift should read ~0 by construction, which is the check that the withholding
# actually happened.
#
# **This arm also lets the READOUT learn**, which the other four do not, and it is the arm stage 1
# says can work at all. Feedback alignment needs the forward path to the output to come into
# alignment with the feedback matrix; a frozen readout cannot, so `random` there is structurally
# unable to align. Measured on the one-step control at 20,000 trials: readout frozen, the broadcast
# arm's best is -0.7031 against a cue-blind floor of -0.6909; readout plastic, it reaches the
# optimum of -0.1353 EXACTLY on every seed.
#
# The readout's own eligibility is the one place in this mechanism where nothing is approximated.
# Its post-synaptic units ARE the action dimensions, so the signal reaching unit k is the score's
# own k-th component -- the identity -- and `d mu_k / d readout[k, c]` is the pooled mean of class c.
# No projection, no truncation, no dropped paths.
#
# This is NOT the plastic readout Logbook 040 measured collapsing. There, under the Hebbian
# eligibility, a plastic output layer's post-synaptic factor is its own OUTPUT, so its rows
# self-amplify toward whatever maximises the action mean (density 1e17). Under e-prop the factor is
# its own ERROR, and there is no such loop.
#
# The readout is EXCLUDED from the homeostatic rescale (`plastic_homeostasis` is [True, False]):
# that returns each unit's incoming norm to construction, and the readout's scale is part of what
# this arm asks about -- R.1d measured +4.51 foods from that scale alone with the direction held.
# The rule's weight bound still applies at 3.0 per entry, which allows a readout norm of 8.49
# against the 7.820 R.1d's PPO harvest reached, so it does not bind on the scale that mattered.
#
# R.2 e-prop arm — eligibility from the settling dynamics, no perturbation.
#
# IDENTICAL to connectomeppo_small_continuous2d_fick_adaptive_klinotaxis_hard350_nodepert_motor.yml
# except the eligibility keys below: `plasticity_eligibility: eprop`, `plasticity_node_noise: 0.0`,
# no perturbation set, and `plasticity_learning_signal`. The cell, the readout, the action noise and
# every rule hyperparameter are R.1c's and R.1d's operating point, unchanged, so this arm's learning
# and frozen levels are directly comparable with node perturbation's 3.751 and 3.150 on it.
#
# The trace is `sum over settling steps s of psi_j^(s+1) * h_i^(s)`, psi the tanh's own derivative:
# the local part of `d h_j / d w_ij`. The paths through OTHER units are dropped -- that truncation is
# the method, and on this substrate it is what leaves a unit's route to the action, beyond the 39
# pooled motor neurons, uncreditable by anything the readout supplies. The trace is unsigned with
# respect to the outcome, so it is held during the forward and given a sign by a per-unit learning
# signal folded in the moment the action is sampled.
#
# `plasticity_rate: 0.001` carries over from the perturbation arms because
# `plasticity_normalise_trace: true` divides the Hebbian term by a running RMS of the trace over its
# edge set: the rate is a root-mean-square step per unit modulator, not an absolute step, and e-prop's
# raw trace magnitude is nothing like `h (x) xi` at sigma 0.1. A rate check on the pilot's disjoint
# seeds is registered against exactly that.
#
# `random` — a fixed random projection over all 302 units, drawn once per run and persisted with the
# checkpoint. No synapse computes it and nothing propagates backwards, which is what makes the signal
# broadcast rather than transported: this is the arm the plausibility claim rests on, and the only one
# that can credit the units the readout does not read.
#
max_steps: 350  # calibrated difficulty (see header)
brain:
  name: connectomeppo
  config:
    action_mode: continuous  # tanh-squashed Gaussian (speed, turn) head

    connectome_source: cook_2019_hermaphrodite

    readout_width: per_neuron  # L.1: 78 params over 39 motor neurons
    enable_gap_junctions: true
    chemical_mask_mode: strict
    sensing_mode: klinotaxis  # 3-feature head-sweep input
    forward_pass_depth: 4
    freeze_updates: false

    # The three-factor rule under the node-perturbation eligibility that passed the rule's positive
    # control, at the scale that passed it. Every setting is the one block I validated; the
    # perturbation set is the only thing this campaign varies.
    learning_rule: three_factor
    enable_activity_traces: true
    plasticity_normalise_modulator: true
    plasticity_normalise_trace: true
    plasticity_homeostasis: true
    initial_log_std: -1.0
    plasticity_rate: 0.001
    plasticity_eligibility: eprop
    plasticity_learning_signal: random
    plasticity_plastic_readout: true
    plasticity_plastic_tensors: readout_only
    plasticity_node_noise: 0.0  # e-prop draws no perturbation
    # The pinned default, written out so the horizon is visible in the file rather than inherited.
    trace_decay: 0.9

    clip_epsilon: 0.2
    gamma: 0.99
    gae_lambda: 0.95
    value_loss_coef: 0.5
    # C1 recipe (see MLP config header): entropy 0.05 + lr 0.0003 on the metric-coherent reward
    # (the bug-era 0.10 / 0.001 compensated for the now-fixed value explosion). Subject to the
    # connectome's own per-seed/entropy check (Stage 2 step 2a).
    entropy_coef: 0.05
    learning_rate: 0.0003
    rollout_buffer_size: 256
    num_epochs: 10
    num_minibatches: 2
    max_grad_norm: 0.5

reward:
  reward_goal: 2.0
  reward_distance_scale: 0.5
  reward_exploration: 0.05
  penalty_step: 0.005
  penalty_anti_dithering: 0.02
  penalty_stuck_position: 0
  penalty_starvation: 10.0
  stuck_position_threshold: 0
  penalty_boundary_collision: 0.02

satiety:
  # Forage-to-survive over the episode (see MLP config header).
  initial_satiety: 300.0
  satiety_decay_rate: 0.8
  satiety_gain_per_food: 0.2  # matches the thermal cell; not a pressure source

environment:
  env_type: continuous_2d
  continuous:
    world_size_mm: 20.0
    body_length_mm: 1.0
    max_step_mm: 1.0
    capture_radius_mm: 2.0  # body/patch scale (calibrated — see MLP config header)
    sweep_amplitude_mm: 0.5
    max_turn_rad: 0.5  # ~29deg/step — biologically realistic turn bound (env default; explicit here)

  viewport_size: [11, 11]

  sensing:
    chemotaxis_mode: klinotaxis
    stam_enabled: true
    stam_buffer_size: 30
    stam_decay_rate: 0.1
    # Adaptive chemosensory sensor: fold-change on the derivative channel.
    adaptive_chemosensor_enabled: true
    adaptive_chemosensor_readout: fold_change
    adaptive_chemosensor_alpha: 0.1  # no-op under fold_change (only `contrast` uses the background)
    adaptive_chemosensor_epsilon: 0.1  # calibrated (0.001 collapses foraging — see MLP config header)

  foraging:
    foods_on_grid: 5
    target_foods_to_collect: 20  # registered saturation remedy (see header)
    min_food_distance: 3
    agent_exclusion_radius: 5
    # Static Fick-shaped gradient geometry (Gaussian kernel, L = decay).
    gradient_field_mode: fick
    gradient_decay_constant: 8.0
    gradient_strength: 1.0
