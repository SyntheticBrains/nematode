# A.1 re-read arm at a second settling depth — per_neuron_fanin initialisation, depth 6
# (Phase 8 A.2, task 11).
#
# Single-key delta from connectomeppo_small_continuous2d_fick_adaptive_klinotaxis_hard350_rewired_null_frozen_fanin.yml:
#   forward_pass_depth: 6
# and nothing else changes.
#
# Why depth 6. A.1 asked whether block V's wiring advantage survives a shared
# initialisation, and answered yes at the committed depth of 4. A.2's PPO surface then
# showed the advantage is depth-critical: abolished at depth 3, reversed at depth 2,
# and surviving at depth 6. Depth 6 is therefore the one other setting where A.1's
# question has something to ask about — at depths 2 and 3 there is no advantage left
# to dissolve, so a control there would test the survival of an absent effect.
#
# Generated from the committed A.1 parent; the single-key claim is re-checked through
# the real config loader by test_init_sharing_reread.py.
#
max_steps: 350
brain:
  name: connectomeppo
  config:
    action_mode: continuous
    connectome_source: cook_2019_hermaphrodite
    enable_gap_junctions: true
    chemical_mask_mode: strict
    sensing_mode: klinotaxis
    weight_draw: per_neuron_fanin
    forward_pass_depth: 6
    wiring: rewired_degree_preserving
    freeze_updates: true
    clip_epsilon: 0.2
    gamma: 0.99
    gae_lambda: 0.95
    value_loss_coef: 0.5
    entropy_coef: 0.05
    learning_rate: 0.0003
    rollout_buffer_size: 256
    num_epochs: 10
    num_minibatches: 2
    max_grad_norm: 0.5
reward:
  reward_goal: 2.0
  reward_distance_scale: 0.5
  reward_exploration: 0.05
  penalty_step: 0.005
  penalty_anti_dithering: 0.02
  penalty_stuck_position: 0
  penalty_starvation: 10.0
  stuck_position_threshold: 0
  penalty_boundary_collision: 0.02
satiety:
  initial_satiety: 300.0
  satiety_decay_rate: 0.8
  satiety_gain_per_food: 0.2
environment:
  env_type: continuous_2d
  continuous:
    world_size_mm: 20.0
    body_length_mm: 1.0
    max_step_mm: 1.0
    capture_radius_mm: 2.0
    sweep_amplitude_mm: 0.5
    max_turn_rad: 0.5
  viewport_size:
  - 11
  - 11
  sensing:
    chemotaxis_mode: klinotaxis
    stam_enabled: true
    stam_buffer_size: 30
    stam_decay_rate: 0.1
    adaptive_chemosensor_enabled: true
    adaptive_chemosensor_readout: fold_change
    adaptive_chemosensor_alpha: 0.1
    adaptive_chemosensor_epsilon: 0.1
  foraging:
    foods_on_grid: 5
    target_foods_to_collect: 20
    min_food_distance: 3
    agent_exclusion_radius: 5
    gradient_field_mode: fick
    gradient_decay_constant: 8.0
    gradient_strength: 1.0
