# D.1 lawn cell, arm `internal_frozen`.
#
# Derived from mlpppo_small_continuous2d_fick_adaptive_klinotaxis_hard350_ppo_w64.yml: max_steps 720; signed speed and reversal;
# max_turn_rad pi; point food replaced by lawns; the stuck-position, anti-dithering,
# exploration and distance rewards zero; reads internal_state; freeze_updates (the floor).
#
# Generated by scripts/campaigns/generate_lawn_configs.py; re-checked through the
# real config loader by test_lawn_configs.py.
#
max_steps: 720
brain:
  name: mlpppo
  config:
    action_mode: continuous
    actor_hidden_dim: 64
    critic_hidden_dim: 64
    num_hidden_layers: 2
    clip_epsilon: 0.2
    gamma: 0.99
    gae_lambda: 0.95
    value_loss_coef: 0.5
    entropy_coef: 0.05
    learning_rate: 0.0003
    rollout_buffer_size: 256
    num_epochs: 10
    num_minibatches: 2
    max_grad_norm: 0.5
    sensory_modules:
    - food_chemotaxis
    - proprioception
    - internal_state
    learning_rule: ppo
    initial_log_std: -1.0
    activation: tanh
    signed_speed: true
    freeze_updates: true
reward:
  reward_goal: 2.0
  reward_distance_scale: 0
  reward_exploration: 0
  penalty_step: 0.005
  penalty_anti_dithering: 0
  penalty_stuck_position: 0
  penalty_starvation: 10.0
  stuck_position_threshold: 0
  penalty_boundary_collision: 0.02
satiety:
  initial_satiety: 300.0
  satiety_decay_rate: 0.8
  satiety_gain_per_food: 0.2
environment:
  env_type: continuous_2d
  continuous:
    world_size_mm: 20.0
    body_length_mm: 1.0
    max_step_mm: 1.0
    capture_radius_mm: 2.0
    sweep_amplitude_mm: 0.5
    max_turn_rad: 3.141593
    allow_reversal: true
  viewport_size:
  - 11
  - 11
  sensing:
    chemotaxis_mode: klinotaxis
    stam_enabled: true
    stam_buffer_size: 30
    stam_decay_rate: 0.1
    adaptive_chemosensor_enabled: true
    adaptive_chemosensor_readout: fold_change
    adaptive_chemosensor_alpha: 0.1
    adaptive_chemosensor_epsilon: 0.1
  foraging:
    agent_exclusion_radius: 5
    gradient_field_mode: fick
    gradient_decay_constant: 8.0
    gradient_strength: 1.0
    food_model: lawns
    lawns:
      count: 4
      radius_mm: 2.5
      min_separation_mm: 2.0
      cell_mm: 1.0
      quality:
      - 1.0
      - 1.0
      intake_fraction: 0.02
      reward_per_intake: 10.0
      satiety_per_intake: 0.3
      regrowth_per_step: 0.0
      movement_cost_per_mm: 0.013
      start_clearance_mm: 2.0
      wall_clearance_mm: 1.0
