# C.1d arm: mlpppo_small_continuous2d_fick_adaptive_klinotaxis_hard350_ppo_w64_body_steps500.
#
# Delta from mlpppo_small_continuous2d_fick_adaptive_klinotaxis_hard350_ppo_w64_reversal.yml, and nothing else changes:
#   environment.continuous.body_model: kinematic
#   brain.config.action_space: body_drive
#   brain.config.signed_speed: removed
#   max_steps: 500
#
# Generated by scripts/campaigns/generate_body_control_configs.py; re-checked
# through the real config loader by test_body_control.py.
#
max_steps: 500
brain:
  name: mlpppo
  config:
    action_mode: continuous
    actor_hidden_dim: 64
    critic_hidden_dim: 64
    num_hidden_layers: 2
    clip_epsilon: 0.2
    gamma: 0.99
    gae_lambda: 0.95
    value_loss_coef: 0.5
    entropy_coef: 0.05
    learning_rate: 0.0003
    rollout_buffer_size: 256
    num_epochs: 10
    num_minibatches: 2
    max_grad_norm: 0.5
    sensory_modules:
    - food_chemotaxis
    - proprioception
    learning_rule: ppo
    initial_log_std: -1.0
    activation: tanh
    action_space: body_drive
reward:
  reward_goal: 2.0
  reward_distance_scale: 0.5
  reward_exploration: 0.05
  penalty_step: 0.005
  penalty_anti_dithering: 0.02
  penalty_stuck_position: 0
  penalty_starvation: 10.0
  stuck_position_threshold: 0
  penalty_boundary_collision: 0.02
satiety:
  initial_satiety: 300.0
  satiety_decay_rate: 0.8
  satiety_gain_per_food: 0.2
environment:
  env_type: continuous_2d
  continuous:
    world_size_mm: 20.0
    body_length_mm: 1.0
    max_step_mm: 1.0
    capture_radius_mm: 2.0
    sweep_amplitude_mm: 0.5
    max_turn_rad: 0.5
    allow_reversal: true
    body_model: kinematic
  viewport_size:
  - 11
  - 11
  sensing:
    chemotaxis_mode: klinotaxis
    stam_enabled: true
    stam_buffer_size: 30
    stam_decay_rate: 0.1
    adaptive_chemosensor_enabled: true
    adaptive_chemosensor_readout: fold_change
    adaptive_chemosensor_alpha: 0.1
    adaptive_chemosensor_epsilon: 0.1
  foraging:
    foods_on_grid: 5
    target_foods_to_collect: 20
    min_food_distance: 3
    agent_exclusion_radius: 5
    gradient_field_mode: fick
    gradient_decay_constant: 8.0
    gradient_strength: 1.0
